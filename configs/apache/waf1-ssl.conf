# Example Apache HTTPS virtual host for the HA WAF lab.
# Adapt paths, backend addresses and certificates to your environment.
# Never commit private keys or production secrets.

Listen 443 https

<VirtualHost *:443>
    ServerName waf.lab.local

    SSLEngine on
    SSLCertificateFile /etc/httpd/ssl/waf.crt
    SSLCertificateKeyFile /etc/httpd/ssl/waf.key

    SecRuleEngine On

    ErrorDocument 403 "<h1>403 Forbidden</h1><p>Request blocked by the WAF (ModSecurity + OWASP CRS).</p>"

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    Header always set X-Served-By "WAF1"

    Alias /waf-status /var/www/waf-status
    <Directory /var/www/waf-status>
        Require all granted
    </Directory>

    Alias /secureapp /var/www/secureapp
    <Directory /var/www/secureapp>
        Require all granted
        DirectoryIndex index.html
    </Directory>
    ProxyPass /secureapp !

    ProxyPass /waf-status !
    ProxyPass /.noindex.html !
    ProxyPass /icons !

    <Proxy "balancer://juiceshop">
        # Replace BACKEND_IP with the backend server address.
        BalancerMember "http://BACKEND_IP:3000" retry=5 connectiontimeout=2 timeout=10
        BalancerMember "http://BACKEND_IP:3001" retry=5 connectiontimeout=2 timeout=10

        # Optional local fallback instances; enable only if configured.
        BalancerMember "http://127.0.0.1:3000" status=+H retry=5
        BalancerMember "http://127.0.0.1:3001" status=+H retry=5

        ProxySet lbmethod=byrequests
    </Proxy>

    ProxyPass / balancer://juiceshop/
    ProxyPassReverse / balancer://juiceshop/

    # Restrict access to the event log endpoint as appropriate for your lab.
    <Location "/waf-status/events.json">
        Require ip 127.0.0.1 ::1
    </Location>

    ErrorLog /var/log/httpd/ssl_error_log
    CustomLog /var/log/httpd/ssl_access_log combined
</VirtualHost>
