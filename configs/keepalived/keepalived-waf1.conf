# Example Keepalived configuration for the primary WAF.
# Replace placeholders for your own lab before deployment.
# Do not commit real VRRP passwords or production addresses.

vrrp_script chk_httpd {
    script "/usr/bin/pidof httpd"
    interval 2
    fall 2
    rise 2
    weight -30
}

vrrp_instance VI_1 {
    state MASTER
    interface ens160
    virtual_router_id 51
    priority 110
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass CHANGE_THIS_SECRET
    }

    virtual_ipaddress {
        192.0.2.150/24
    }

    track_script {
        chk_httpd
    }
}
